<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Efrain Gonzalez</title>
    <link rel="stylesheet" href="styles/contact.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Huninn&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda+SC:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Huninn&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <img src="./assets/image/logo/logo1.png" alt="Logo de Efraín" class="logo">
        </div>
        <nav class="nav-links">
            <a href="index.html">INICIO</a>
            <a href="galeria.html">GALERIA</a>
            <a href="servicios.html">SERVICIOS</a>
            <a href="contact.html">CONTACTOS</a>   
        </nav>
    </header>

    <main class="contact-container">
        <div class="contact-info">
            <h1>Contáctanos</h1>
            <p>¿Listo para capturar tus momentos especiales? Completa el formulario y nos pondremos en contacto contigo.</p>
            
            <div class="info-item">
                <i class="fas fa-envelope"></i>
                <span>efraingonzalez.ph@gmail.com</span>
            </div>
            
            <div class="info-item">
                <i class="fas fa-phone"></i>
                <span>+595 984 805 643</span>
            </div>
            
            <div class="info-item">
                <i class="fas fa-map-marker-alt"></i>
                <span>Luque, Central, Paraguay</span>
            </div>
        </div>

        <form class="contact-form">
            <div class="form-group">
                <label for="name">Nombre y Apellido</label>
                <input type="text" id="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Teléfono</label>
                <input type="tel" id="phone">
            </div>
            
            <div class="form-group">
                <label for="service">Tipo de sesión</label>
                <select id="service">
                    <option value="">Selecciona una opción</option>
                    <option value="bodas">Bodas</option>
                    <option value="retratos">Retratos</option>
                    <option value="retratos">Sesiones de Fotos</option>
                    <option value="productos">Fotografía de productos</option>
                    <option value="eventos">Eventos corporativos</option>
                    <option value="otros">Otros</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="message">Mensaje</label>
                <textarea id="message" rows="5" required></textarea>
            </div>
            
            <button type="submit">Enviar mensaje</button>
        </form>
    </main>
</body>
</html>
