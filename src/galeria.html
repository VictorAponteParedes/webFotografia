<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Efrain Gonzalez - Galería de Fotos</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/galeria.css" />
  <style>
        @import url('https://fonts.googleapis.com/css2?family=Huninn&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda+SC:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Huninn&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
  </style>
</head>

<body>
  <header class="navbar">
    <div class="logo-container">
      <img src="./assets/image/logo/logo1.png" alt="Logo de Efraín" class="logo">
    </div>
    <nav class="nav-links">
      <a href="index.html">INICIO</a>
      <a href="galeria.html">GALERIA</a>
      <a href="servicios.html">SERVICIOS</a>
      <a href="contact.html">CONTACTOS</a>   
    </nav>
  </header>

  <main>
    <section class="galeria-section">
      <h2>Bodas</h2>
      <div class="gallery">
        <div class="galeria-card"><img src="./assets/image/home/imagen1.jpeg" alt="Boda 1" class="galeria-img" /></div>
        <div class="galeria-card"><img src="./assets/image/home/imagen2.jpeg" alt="Boda 2" class="galeria-img" /></div>
        <div class="galeria-card"><img src="./assets/image/home/imagen3.jpeg" alt="Boda 3" class="galeria-img" /></div>
      </div>
    </section>

    <section class="galeria-section">
      <h2>15 Años</h2>
      <div class="gallery">
        <div class="galeria-card"><img src="./assets/image/inspiracion/imagen1.jpeg" alt="15 Años 1"
            class="galeria-img" /></div>
        <div class="galeria-card"><img src="./assets/image/inspiracion/imagen2.jpeg" alt="15 Años 2"
            class="galeria-img" /></div>
        <div class="galeria-card"><img src="./assets/image/inspiracion/imagen3.jpeg" alt="15 Años 3"
            class="galeria-img" /></div>
      </div>
    </section>

    <section class="galeria-section">
      <h2>Corporativos</h2>
      <div class="gallery">
        <div class="galeria-card"><img src="./assets/image/home/imagen1.jpeg" alt="Corporativo 1" class="galeria-img" />
        </div>
        <div class="galeria-card"><img src="./assets/image/home/imagen2.jpeg" alt="Corporativo 2" class="galeria-img" />
        </div>
        <div class="galeria-card"><img src="./assets/image/home/imagen3.jpeg" alt="Corporativo 3" class="galeria-img" />
        </div>
      </div>
    </section>

    <section class="galeria-section">
      <h2>Eventos y Videos Sociales</h2>
      <div class="gallery">
        <div class="galeria-card"><img src="./assets/image/inspiracion/imagen1.jpeg" alt="Evento 1"
            class="galeria-img" /></div>
        <div class="galeria-card"><img src="./assets/image/inspiracion/imagen2.jpeg" alt="Evento 2"
            class="galeria-img" /></div>
        <div class="galeria-card"><img src="./assets/image/inspiracion/imagen3.jpeg" alt="Evento 3"
            class="galeria-img" /></div>
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Ampliado" />
  </div>

  <script>
    const images = document.querySelectorAll('.galeria-img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    images.forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.style.display = 'flex';
      });
    });

    function closeLightbox() {
      lightbox.style.display = 'none';
    }
  </script>
</body>

</html>
